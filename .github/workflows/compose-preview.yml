name: Compose Preview

on:
  push:
    branches: [main]
  pull_request_target:
    branches: [main]
    types: [opened, synchronize]
  workflow_dispatch:

permissions:
  contents: write          # baselines push + compose-preview/pr branch
  pull-requests: write     # upserts the PR comment

concurrency:
  group: compose-preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          lfs: 'true'

      - name: Copy CI gradle.properties
        run: mkdir -p ~/.gradle ; cp .github/ci-gradle.properties ~/.gradle/gradle.properties

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: zulu
          java-version: 21

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6

      - uses: yschimke/compose-ai-tools/.github/actions/apply@aaac0585636f4913ce78d60bc7816f8ea79a4751 # main
